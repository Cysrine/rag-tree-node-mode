[project]
name = "rag-tree"
version = "0.1.0"
description = "Structure-aware RAG pipeline for PDFs that preserves document hierarchy end-to-end (root-to-leaf chunksets over pgvector)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anant Raghavan", email = "anant.j.raghavan@gmail.com" }]

# Core deps are intentionally light so the pipeline imports and the fallback
# parser + tests run without the heavy ML/OCR stack. Everything heavy lives in
# optional-dependencies and is lazy-imported at call time.
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",  # load .env into os.environ (e.g. hyphenated API-key names)
    "pdfplumber>=0.11",   # fallback parser: text + coordinates + font metadata
    "pypdf>=4.2",         # cheap page/text probing for scanned detection
]

[project.optional-dependencies]
# Structure-aware parsing: hi-res layout model + OCR. Fiddly on native Windows;
# prefer the Docker parser image (see docker-compose.yml / Dockerfile).
parse = [
    "unstructured[pdf]>=0.14",
    "pdf2image>=1.17",
    "pytesseract>=0.3.10",
    "onnxruntime>=1.17",   # backs the 'yolox' hi-res layout model (no detectron2)
    "pillow>=10.0",
]
# Default embedding provider: local BGE via sentence-transformers.
embed-local = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
# Alternative embedding providers (pluggable behind the same interface).
embed-voyage = ["voyageai>=0.2"]
embed-openai = ["openai>=1.30"]
# Generation (Phase 6): Groq-hosted LLMs (Qwen3, Llama, ...).
llm-groq = ["groq>=0.11"]
# Storage / vector store.
storage = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "reportlab>=4.1",   # synthesizes sample PDFs for tests (no user files needed)
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
rag-parse = "rag_pipeline.ingestion.cli:main"
rag-tree = "rag_pipeline.structure.cli:main"
rag-chunk = "rag_pipeline.chunking.cli:main"
rag-ingest = "rag_pipeline.pipeline:main"
rag-search = "rag_pipeline.retrieval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_pipeline"]

[tool.hatch.build]
# schema.sql etc. are data files shipped with the package.
include = ["rag_pipeline/**/*.py", "rag_pipeline/**/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
