# Postgres + pgvector for the tree/vector store, and an optional Linux "parser"
# container so hi-res parsing + OCR run cleanly regardless of host OS (handy on
# Windows, where unstructured's native deps are painful).
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_tree_db
    restart: unless-stopped   # survive Docker Desktop / machine restarts
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      # Host 5433 avoids clashing with a native Postgres on the default 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema.sql is applied automatically on first boot of an empty volume.
      - ./rag_pipeline/storage/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opt-in: `docker compose --profile parse run --rm parser /data/yourfile.pdf`
  # Mounts the repo (live code) and ./data (put your PDFs there).
  parser:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["parse"]
    volumes:
      - ./:/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
